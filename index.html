                !ownedIds.has(j.id) &&
                (BASE_JOKER_IDS.has(j.id) || unlockedJokerIds.has(j.id))
            );
            const shuffled = [...available].sort(() => 0.5 - Math.random());
            const shopStock = shuffled.slice(0, 3);
            
            if(shopStock.length === 0 && unlockedSlots >= GAME_CONFIG.MAX_SLOTS) {
                shopItemsContainer.innerHTML = '<div style="color:#aaa; font-size:16px; padding:20px;">已集齐所有已解锁小丑牌！</div>';
            }

            shopStock.forEach(item => {
                const el = document.createElement('div');
                el.className = 'shop-item';
                el.innerHTML = `
                    <b>${item.name}</b>
                    <small>${item.desc}</small>
                    <span class="cost">$${item.cost}</span>
                `;
                el.onclick = () => buyItem(item, el);
                shopItemsContainer.appendChild(el);
            });

            // v2.2: 新增槽位商品（与小丑牌并列展示）
            if(unlockedSlots < GAME_CONFIG.MAX_SLOTS) {
                const slotIndex = unlockedSlots;   // 下一个要购买的槽位序号（0-based）
                const slotCost = GAME_CONFIG.SLOT_COSTS[slotIndex];
                const slotEl = document.createElement('div');
                slotEl.className = 'shop-item slot-shop-item';
                slotEl.innerHTML = `
                    <b>槽位 #${slotIndex + 1}</b>
                    <small>解锁一个小丑牌槽位<br>每次消除时有 30% 概率触发</small>
                    <span class="cost">$${slotCost}</span>
                `;
                slotEl.onclick = () => buySlot(slotIndex, slotCost, slotEl);
                shopItemsContainer.appendChild(slotEl);
            }
        }

        // v2.2: 购买槽位
        function buySlot(slotIndex, cost, element) {
            if(unlockedSlots >= GAME_CONFIG.MAX_SLOTS) return;
            const actualCost = GAME_CONFIG.SLOT_COSTS[unlockedSlots];
            if(gold < actualCost) {
                alert("金币不足! (Not enough gold)");
                return;
            }
            gold -= actualCost;
            unlockedSlots++;
            slots.push(null);  // 新槽位初始为空
            updateUI();
            element.classList.add('sold');
            element.innerHTML = `<b>已解锁</b><small>槽位 #${slotIndex + 1} 已激活</small>`;
        }

        function buyItem(item, element) {
            // 已拥有的牌不能重复购买
            if(inventory.find(e => e.joker.id === item.id)) {
                return;
            }
            if(gold >= item.cost) {
                gold -= item.cost;
                updateUI();
                // 加入背包（永久持有）
                addToInventory(item);
                renderInventory();
                
                element.classList.add('sold');
                element.innerHTML = `<b>已售出</b><small>Sold Out</small>`;
            } else {
                alert("金币不足! (Not enough gold)");
            }
        }

        // v2.2: "进入下一局"按钮点击 —— 如果有槽位则弹出选牌界面，否则直接 initGame
        // v2.3: 还需考虑本关 maxSlots 限制，若本关有效槽位为 0 则直接开局
        function onNextLevelClick() {
            const levelCfg = getLevelConfig(level);
            const effectiveSlots = Math.min(unlockedSlots, levelCfg.maxSlots);
            if(effectiveSlots > 0) {
                openSlotPicker();
            } else {
                initGame();
            }
        }

        // ========== 开局选牌界面 ==========

        function openSlotPicker() {
            pickerSelectedJoker = null;
            renderSlotPicker();
            document.getElementById('slotPickerOverlay').classList.add('active');
        }

        function closeSlotPicker() {
            document.getElementById('slotPickerOverlay').classList.remove('active');
            pickerSelectedJoker = null;
            initGame();
        }

        // 渲染选牌界面（槽位行 + 背包行）
        function renderSlotPicker() {
            const slotsEl = document.getElementById('slotPickerSlots');
            const invEl = document.getElementById('slotPickerInventory');
            slotsEl.innerHTML = '';
            invEl.innerHTML = '';

            // v2.3: 本关可用槽位数 = min(已解锁槽位数, 当前关卡 maxSlots)
            const levelCfg = getLevelConfig(level);
            const effectiveSlots = Math.min(unlockedSlots, levelCfg.maxSlots);

            // --- 槽位行（只展示本关允许使用的槽位数量）---
            for(let i = 0; i < effectiveSlots; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot-card';
                const filled = slots[i];

                if(pickerSelectedJoker && !filled) {
                    slotDiv.classList.add('slot-target-highlight');
                }

                if(filled) {
                    // 已装牌：点击退回背包
                    slotDiv.classList.add('slot-filled');
                    slotDiv.innerHTML = `
                        <div class="slot-label">槽位 ${i + 1}</div>
                        <div class="slot-joker-name">${filled.name}</div>
                        <div class="slot-remove-hint">点击退回</div>
                    `;
                    slotDiv.onclick = () => {
                        slots[i] = null;
                        renderSlotPicker();
                    };
                } else {
                    // 空槽位
                    slotDiv.classList.add('slot-empty');
                    slotDiv.innerHTML = `
                        <div class="slot-label">槽位 ${i + 1}</div>
                        <div style="font-size:24px;color:#555;">＋</div>
                        <div class="slot-joker-hint">点击装入</div>
                    `;
                    slotDiv.onclick = () => {
                        if(pickerSelectedJoker) {
                            // 同一张牌可以放多个槽位（策划允许）
                            slots[i] = { ...pickerSelectedJoker };
                            pickerSelectedJoker = null;
                            renderSlotPicker();
                        }
                    };
                }
                slotsEl.appendChild(slotDiv);
            }

            // 若本关 maxSlots 限制导致有效槽位为 0，展示提示
            if(effectiveSlots === 0 && unlockedSlots > 0) {
                slotsEl.innerHTML = `<div style="color:#888;font-size:13px;text-align:center;padding:10px;">本关不允许使用槽位</div>`;
            }

            // --- 背包行 ---
            if(inventory.length === 0) {
                invEl.innerHTML = '<div style="color:#666;font-size:13px;">背包为空</div>';
                return;
            }
            inventory.forEach(entry => {
                const j = entry.joker;
                const card = document.createElement('div');
                card.className = 'picker-joker-card';
                if(pickerSelectedJoker && pickerSelectedJoker.id === j.id) {
                    card.classList.add('selected-pick');
                }
                // 类型提示
                let typeHint = '';
                if(j.color) {
                    const colorName = { 'c-red': '红色', 'c-blue': '蓝色', 'c-green': '绿色', 'c-yellow': '黄色', 'c-purple': '紫色' };
                    typeHint = colorName[j.color] || '';
                }
                card.innerHTML = `<b>${j.name}</b><small>${j.desc.replace(/<br>/g, ' ')}</small>`;
                card.onclick = () => {
                    // 切换选中状态
                    if(pickerSelectedJoker && pickerSelectedJoker.id === j.id) {
                        pickerSelectedJoker = null;
                    } else {
                        pickerSelectedJoker = j;
                    }
                    renderSlotPicker();
                };
                invEl.appendChild(card);
            });
        }

        // Start
        resetGameFull();
    </script>
</body>
